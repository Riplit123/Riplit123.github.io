<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Портфолио игрового разработчика</title>
    <!-- Font Awesome 6 (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Подключаем внешний CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- НАВИГАЦИЯ ПО ЦЕНТРУ -->
    <nav>
        <div class="nav-container">
            <a href="#about" class="nav-link">Обо мне</a>
            <a href="#portfolio" class="nav-link">Портфолио</a>
            <a href="#contacts" class="nav-link">Контакты</a>
        </div>
    </nav>

    <main>
        <!-- СЕКЦИЯ ОБО МНЕ -->
        <section id="about">
            <h2>Обо мне</h2>
            <div class="about-content">
                <div class="about-text">
                    <p class="greeting">Разработчик игр и интерактивных приложений</p>
                    <p>
                      На стадии заполнения
                    </p>
                </div>
                <div class="tech-stack">
                    <span class="tech-badge">C# / Unity</span>
                    <span class="tech-badge">HTML, CSS, JS</span>
                    <span class="tech-badge">TouchDesigner</span>
                    <span class="tech-badge">C# / .NET MAUI</span>
                    <span class="tech-badge">Git / GitHub</span>
                </div>
            </div>
        </section>

        <!-- СЕКЦИЯ ПОРТФОЛИО -->
        <section id="portfolio">
            <h2>Портфолио</h2>
            <div class="projects-grid" id="projectsGrid"></div>
        </section>

        <!-- СЕКЦИЯ КОНТАКТЫ (только Telegram и Email) -->
        <section id="contacts">
            <h2>Контакты</h2>
            <div class="contacts">
                <div class="contacts-list">
                    <div class="contact-item">
                        <i class="fab fa-telegram"></i>
                        <span>https://t.me/DmitryN1k</span>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <span>nikitindmitriy.nn@gmail.com</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="closeModalBtn">&times;</span>
            <div id="modalDynamicContent"></div>
        </div>
    </div>

    <!-- Подключаем внешний JavaScript -->
    <script src="script.js"></script>
</body>
</html>
